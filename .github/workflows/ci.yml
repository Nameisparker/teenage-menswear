name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # PageProps<"/products"> and friends are generated, and .next is not
      # committed, so without this every page fails to type-check on a clean
      # checkout. typegen does only that — no bundling, no env vars, no
      # database — which is what keeps this job runnable without secrets.
      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

# Deliberately not here: `next build` and any end-to-end run. Both need real
# Supabase credentials — the catalog read throws rather than rendering an empty
# storefront when the project is unreachable — so they need secrets and a seeded
# test project. Worth adding; not worth faking with a build that cannot fetch.
